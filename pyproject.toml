[project]
name = "qgis-amazonlocationservice-plugin"
version = "4.3.0"
description = "QGIS Plugin for Amazon Location Service"
readme = "README.md"
# QGIS 3.34 LTR bundles Python 3.9.
requires-python = ">=3.9"
authors = [
    { name = "MIERUNE Inc.", email = "info@mierune.co.jp" }
]
dependencies = []

[dependency-groups]
dev = [
    "pyqt5-stubs>=5.15.6.0",
    "PyQt6-stubs>=6.4.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "B",
    "N",
    "UP",
    "I",
    "C90",
    "C4",
    "DTZ",
    "PIE",
    "PT",
    "Q",
    "SIM",
    "RUF",
]
ignore = [
    "N802",  # QGIS and Qt APIs require camelCase names.
    "PT027",  # Tests use unittest assertions under the QGIS test runner.
]
