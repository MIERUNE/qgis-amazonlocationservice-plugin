name: Test plugin

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: qgis/qgis

jobs:
  test-plugin:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Cover qgisMinimumVersion (3.34 LTR) and QGIS 4.
        docker_tags: ["release-3_34", "4.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker pull QGIS
        run: |
          docker pull "$DOCKER_IMAGE":${{ matrix.docker_tags }}

      - name: Run tests
        timeout-minutes: 10
        run: |
          # PIP_BREAK_SYSTEM_PACKAGES is ignored by older pip releases,
          # unlike the --break-system-packages flag.
          docker run --rm \
            -v "${{ github.workspace }}":/plugin \
            -w /plugin \
            -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            "$DOCKER_IMAGE":${{ matrix.docker_tags }} \
            sh -c "
              pip3 install pytest pytest-qgis &&
              xvfb-run -s '+extension GLX -screen 0 1024x768x24' \
                python3 -m pytest -v
            "
