name: Test plugin

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: qgis/qgis

jobs:
  test-plugin:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Cover qgisMinimumVersion (3.44 LTR) and QGIS 4.
        docker_tags: ["3.44", "4.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Export locked test dependencies
        # The QGIS image has pip but no uv, so the container installs the
        # pinned, hashed requirements exported from uv.lock. They are
        # installed with --ignore-installed because pip cannot uninstall the
        # Debian-packaged copies (e.g. Pygments) that they replace.
        run: |
          uv export --locked --only-group test --no-emit-project \
            --output-file "$RUNNER_TEMP/requirements-test.txt"

      - name: Docker pull QGIS
        run: |
          docker pull "$DOCKER_IMAGE":${{ matrix.docker_tags }}

      - name: Run tests
        timeout-minutes: 10
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/plugin \
            -w /plugin \
            -v "$RUNNER_TEMP/requirements-test.txt":/tmp/requirements-test.txt:ro \
            "$DOCKER_IMAGE":${{ matrix.docker_tags }} \
            sh -c "
              pip3 install --break-system-packages --ignore-installed -r /tmp/requirements-test.txt &&
              xvfb-run -s '+extension GLX -screen 0 1024x768x24' \
                python3 -m pytest -v
            "
