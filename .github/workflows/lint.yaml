name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked --python 3.9

      - name: Compile with Python 3.9
        run: python -m compileall -q location_service

      - name: Lint with ruff
        run: uv run --locked --python 3.9 ruff check --output-format=github .

      - name: Format with ruff
        run: uv run --locked --python 3.9 ruff format . --check --diff
