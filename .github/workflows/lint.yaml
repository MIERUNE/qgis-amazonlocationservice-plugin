name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked --python 3.10

      - name: Compile with Python 3.10
        run: python -m compileall -q location_service

      - name: Lint with ruff
        run: uv run --locked --python 3.10 ruff check --output-format=github .

      - name: Format with ruff
        run: uv run --locked --python 3.10 ruff format . --check --diff

      - name: Security check with Bandit
        run: uv run --locked --python 3.10 bandit -c pyproject.toml -l -r location_service
