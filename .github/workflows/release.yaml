name: Release

on:
  release:
    types: [published]

env:
  PLUGIN_NAME: location_service

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf 'Invalid release tag format: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create Archive
        run: |
          archive_name="${PLUGIN_NAME}-${RELEASE_TAG}.zip"
          git archive \
            --format=zip \
            --output="$archive_name" \
            HEAD \
            "$PLUGIN_NAME" \
            ":(exclude)$PLUGIN_NAME/tests" \
            ":(exclude)$PLUGIN_NAME/test_suite.py"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive_name="${PLUGIN_NAME}-${RELEASE_TAG}.zip"
          gh release upload "$RELEASE_TAG" "$archive_name"
