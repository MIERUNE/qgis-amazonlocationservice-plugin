name: Release

on:
  release:
    types: [published]

env:
  PLUGIN_NAME: location_service

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf 'Invalid release tag format: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          # Keep metadata versions without the "v" prefix, as in past releases.
          echo "PLUGIN_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Create Plugin Directory
        run: |
          mkdir dist
          git archive --format=tar HEAD "$PLUGIN_NAME" \
            ":(exclude)$PLUGIN_NAME/tests" | tar -x -C dist

      - name: Write version to metadata.txt
        run: |
          sed -i "s/^version=.*/version=$PLUGIN_VERSION/" "dist/$PLUGIN_NAME/metadata.txt"
          grep -qx "version=$PLUGIN_VERSION" "dist/$PLUGIN_NAME/metadata.txt"
          cat "dist/$PLUGIN_NAME/metadata.txt"

      - name: Create Archive
        run: |
          cd dist
          zip -r "../$PLUGIN_NAME.zip" "$PLUGIN_NAME"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "$PLUGIN_NAME.zip" --clobber

      - name: Upload to plugins.qgis.org
        # Pre-releases stay on GitHub only.
        if: ${{ !github.event.release.prerelease }}
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          curl -X POST \
            "https://plugins.qgis.org/plugins/api/$PLUGIN_NAME/version/add/" \
            -H "Authorization: Bearer $QGIS_PLUGIN_TOKEN" \
            -F "package=@$PLUGIN_NAME.zip" \
            --fail
